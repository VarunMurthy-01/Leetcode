name: Sync LeetHub to Main GitHub

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout spam repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to main GitHub
        run: |
          git push https://x-access-token:${{ secrets.MAIN_GITHUB_TOKEN }}@github.com/Varunmurthy-07/LeetCode.git HEAD:main
