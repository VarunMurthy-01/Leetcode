name: Sync LeetHub to Main GitHub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify token
        env:
          GH_TOKEN: ${{ secrets.MAIN_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: Token is missing"
            exit 1
          fi
          echo "Token is present"

      - name: Push to main GitHub
        env:
          GH_TOKEN: ${{ secrets.MAIN_GITHUB_TOKEN }}
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(echo -n "x-access-token:$GH_TOKEN" | base64 -w 0)" \
          push https://github.com/Varunmurthy-07/LeetCode.git HEAD:main
